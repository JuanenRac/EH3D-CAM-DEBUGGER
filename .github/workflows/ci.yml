name: EH3D CI baseline

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate the repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Manifest, documentation and language parity
        run: python -I tools/ci_validate.py

      - name: Pictures of the README
        run: |
          python -I tools/make_architecture.py --check
          python -I tools/make_structure.py --check --readmes
  rust:
    name: Rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5
        with:
          path: EH3D-CAM-DEBUGGER
      - name: Check out the sibling EH3D-CORE-LIBS (a path dependency)
        uses: actions/checkout@v5
        with:
          repository: JuanenRac/EH3D-CORE-LIBS
          path: EH3D-CORE-LIBS
      - name: Rust toolchain
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Format
        run: cargo fmt --check
        working-directory: EH3D-CAM-DEBUGGER
      - name: Lints
        run: cargo clippy --all-targets -- -D warnings
        working-directory: EH3D-CAM-DEBUGGER
      - name: Tests
        run: cargo test --all-targets
        working-directory: EH3D-CAM-DEBUGGER
